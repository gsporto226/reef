name: browser
description: Integration app — a web browser on reef's windowing, Windows only (docs/integration-apps.md).
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  reef: ^0.1.0
  reef_router: ^0.1.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
